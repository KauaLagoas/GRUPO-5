<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificações - Troca de Habilidades</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background-color: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; }
        .cabecalho { display: flex; justify-content: space-between; padding: 20px; border-bottom: 1px solid #ddd; align-items: center; }
        .badge { background: #0066cc; color: white; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; }
        th { background: #f9f9f9; color: #555; font-size: 14px; }
        .nao-lida { background-color: #f0f7ff; }
        .tag { padding: 5px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .tag-solicitacao { background: #fff3cd; color: #856404; }
        .tag-aceita { background: #d4edda; color: #155724; }
        .tag-recusada { background: #f8d7da; color: #721c24; }
        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; color: white; margin-right: 5px; }
        .btn-aceitar { background: #28a745; }
        .btn-recusar { background: #dc3545; }
        .btn-neutro { background: #ccc; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cabecalho">
            <h2>Notificações</h2>
            <span class="badge">1 Nova</span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Mensagem</th>
                    <th>Data</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Sprint 9: Nova Solicitação -->
                <tr class="nao-lida">
                    <td><span class="tag tag-solicitacao">Nova Solicitação</span></td>
                    <td><strong>João</strong> quer trocar habilidades de <em>Inglês</em>.</td>
                    <td>Hoje, 10:00</td>
                    <td>
                        <button class="btn btn-aceitar">Aceitar</button>
                        <button class="btn btn-recusar">Recusar</button>
                    </td>
                </tr>
                <!-- Sprint 9: Sessão Aceita -->
                <tr>
                    <td><span class="tag tag-aceita">Sessão Aceita</span></td>
                    <td><strong>Maria</strong> aceitou seu pedido para <em>Design</em>.</td>
                    <td>Ontem</td>
                    <td><button class="btn btn-neutro">Ver detalhes</button></td>
                </tr>
                <!-- Sprint 9: Sessão Recusada -->
                <tr>
                    <td><span class="tag tag-recusada">Sessão Recusada</span></td>
                    <td><strong>Pedro</strong> recusou a troca no momento.</td>
                    <td>10 Nov</td>
                    <td><button class="btn btn-neutro">OK</button></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
