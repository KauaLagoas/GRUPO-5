{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denunciar - Desenrola</title>
    <link rel="stylesheet" href="{% static 'css/denuncia.css' %}">
</head>
<body>
    <nav class="topbar">
        <a href="{% url 'meu_perfil' %}" class="btn-back">❮ Voltar</a>
        <h1 class="page-title">Fazer denúncia</h1>
        <div class="spacer"></div>
    </nav>

    <main class="container">
        {% if messages %}
            <div class="messages-container">
                {% for message in messages %}
                    <div class="alert-success">
                        <span class="icon">✓</span>
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <section class="card">
            <div class="card-header">
                <h2>Relatar um problema</h2>
                <p>Ajude a manter a comunidade do Desenrola segura.</p>
            </div>

            <form method="POST" action="{% url 'reportar' %}">
                {% csrf_token %}
                
                <div class="form-row">
                    <div class="input-group">
                        <label>O que você está denunciando?</label>
                        <select name="tipo" required>
                            <option value="" disabled selected>Selecione uma opção</option>
                            <option value="usuario">Comportamento de um usuário</option>
                            <option value="habilidade">Uma habilidade inadequada</option>
                        </select>
                    </div>
                    
                    <div class="input-group">
                        <label>Nome do usuário ou habilidade</label>
                        <input type="text" name="alvo" required placeholder="Ex: João Silva ou 'Hackear redes'">
                    </div>
                </div>

                <div class="input-group full-width">
                    <label>Motivo principal</label>
                    <input type="text" name="motivo" required placeholder="Ex: Linguagem ofensiva, conteúdo falso...">
                </div>

                <div class="input-group full-width">
                    <label>Descreva o que aconteceu em detalhes</label>
                    <textarea name="descricao" rows="4" required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Enviar denúncia</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
